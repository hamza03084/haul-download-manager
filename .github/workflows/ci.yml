name: CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Ensure the Electron binary is present
        run: node node_modules/electron/install.js

      - name: Typecheck (lint)
        run: npm run typecheck

      - name: Unit and integration tests
        run: npm test

      - name: Build installer and portable executable
        run: npm run dist

      - name: End-to-end test of the packaged app
        run: node scripts/e2e.mjs --exe "release/win-unpacked/Haul Download Manager.exe"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: haul-windows-x64
          path: |
            release/*.exe
            e2e-output/*.png
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: haul-windows-x64
          path: artifacts
      - name: Create GitHub release (draft)
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${GITHUB_REF_NAME}" artifacts/release/*.exe
          --repo "${GITHUB_REPOSITORY}" --draft --title "Haul ${GITHUB_REF_NAME}"
          --notes "Unsigned Windows build. See README for SmartScreen instructions."
